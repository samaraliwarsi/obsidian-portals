name: Attest release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attest (e.g. 1.3.0)'
        required: true

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download assets from the release
        run: |
          gh release download ${{ github.event.inputs.tag }} \
            --repo ${{ github.repository }} \
            --pattern 'main.js' \
            --pattern 'styles.css'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css