name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attest (e.g. 1.3.0)'
        required: true

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download assets from the release
        run: |
          gh release download ${{ github.event.inputs.tag || github.event.release.tag_name }} \
            --repo ${{ github.repository }} \
            --pattern 'main.js' \
            --pattern 'styles.css'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css