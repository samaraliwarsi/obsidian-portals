name: Attest release assets

on:
  release:
    types: [published]      # triggers only when you publish a release manually

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Attest main.js and styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css